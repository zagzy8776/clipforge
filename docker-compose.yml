services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: clipforge
      POSTGRES_USER: clipforge
      POSTGRES_PASSWORD: clipforge_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: pg_isready -U clipforge
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: redis-cli ping
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: clipforge
      MINIO_ROOT_PASSWORD: clipforge_dev
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  worker:
    build:
      context: ..
      dockerfile: docker/worker.Dockerfile
    environment:
      DATABASE_URL: postgresql://clipforge:clipforge_dev@postgres:5432/clipforge
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: clipforge
      S3_ACCESS_KEY: clipforge
      S3_SECRET_KEY: clipforge_dev
      FFMPEG_PATH: /usr/bin/ffmpeg
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    volumes:
      - worker-temp:/tmp/clipforge

  web:
    build:
      context: ..
      dockerfile: docker/web.Dockerfile
    environment:
      DATABASE_URL: postgresql://clipforge:clipforge_dev@postgres:5432/clipforge
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: clipforge
      S3_ACCESS_KEY: clipforge
      S3_SECRET_KEY: clipforge_dev
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  miniodata:
  worker-temp:
